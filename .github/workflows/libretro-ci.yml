name: Libretro Core CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag to build/publish; empty means a verification build'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: libretro-${{ github.workflow }}-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Linux x86_64, os: ubuntu-24.04, shell: bash, target: x86_64-unknown-linux-gnu, binary: tgpulse_next_m1_libretro.so, artifact: tgpulse-next-m1-libretro-linux-x86_64}
          - {name: Linux ARM64, os: ubuntu-24.04-arm, shell: bash, target: aarch64-unknown-linux-gnu, binary: tgpulse_next_m1_libretro.so, artifact: tgpulse-next-m1-libretro-linux-arm64}
          - {name: macOS Apple Silicon, os: macos-15, shell: bash, target: aarch64-apple-darwin, binary: tgpulse_next_m1_libretro.dylib, artifact: tgpulse-next-m1-libretro-macos-arm64}
          - {name: macOS Intel, os: macos-15-intel, shell: bash, target: x86_64-apple-darwin, binary: tgpulse_next_m1_libretro.dylib, artifact: tgpulse-next-m1-libretro-macos-x86_64}
          - {name: Windows x86_64, os: windows-2022, shell: 'msys2 {0}', target: x86_64-pc-windows-gnu, binary: tgpulse_next_m1_libretro.dll, artifact: tgpulse-next-m1-libretro-windows-x86_64}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - name: Check out current CI validation tools separately from tagged core source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .ci-tools
          sparse-checkout: tools/check_libretro_artifact.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Set up Windows GNU toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: false
          install: make mingw-w64-x86_64-gcc
      - name: Set up Windows Rust target
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-gnu
      - name: Record native toolchain
        run: |
          rustc -Vv
          cargo --version
          python --version
          if [[ "$RUNNER_OS" == Windows ]]; then
            echo 'CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=gcc' >> "$GITHUB_ENV"
            echo 'CC_x86_64_pc_windows_gnu=gcc' >> "$GITHUB_ENV"
            echo 'CXX_x86_64_pc_windows_gnu=g++' >> "$GITHUB_ENV"
          fi
      - name: Build core with the shared Libretro recipe
        run: make -f Makefile.libretro TARGET_ARCH='${{ matrix.target }}'
      - name: Run machine and adapter checks without ROMs
        run: |
          # Separate invocations prevent standalone/default feature unification
          # from turning M1 tests into full-system tests.
          cargo test --locked -p tgpulse-core --no-default-features --features model1 --target '${{ matrix.target }}'
          cargo test --locked -p tgpulse-libretro --target '${{ matrix.target }}'
          cargo check --locked -p tgpulse-core --no-default-features --features model2 --target '${{ matrix.target }}'
          cargo test --locked -p tgpulse-core --target '${{ matrix.target }}'
          python .ci-tools/tools/check_libretro_artifact.py '${{ matrix.binary }}' --target '${{ matrix.target }}' --info tgpulse_next_m1_libretro.info --machine-scope model1
      - name: Audit committed NVRAM catalogue and documentary screenshots
        if: runner.os == 'Linux'
        run: ruby tools/audit_model1_campaign_inventory.rb --source-only
      - name: Assemble and validate platform package
        run: |
          version="$(python -c 'import pathlib,re; print(re.search(r"^display_version = \"([^\"]+)\"", pathlib.Path("tgpulse_next_m1_libretro.info").read_text(), re.M).group(1))')"
          python tools/package_libretro.py \
            --core '${{ matrix.binary }}' \
            --output dist/package --target '${{ matrix.target }}' \
            --archive "dist/${{ matrix.artifact }}-${version}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish verified preview release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: tgpulse-next-m1-libretro-*
          path: release/packages
          merge-multiple: true
      - name: Verify tag, all five packages and source revision
        run: |
          python - "$RELEASE_TAG" <<'PY'
          import hashlib, pathlib, subprocess, sys, zipfile
          from tools.package_libretro import check, version
          tag = sys.argv[1]
          assert tag == 'v' + version(), (tag, version())
          root = pathlib.Path('release/packages')
          names = ['linux-x86_64', 'linux-arm64', 'macos-arm64', 'macos-x86_64', 'windows-x86_64']
          expected = {f'tgpulse-next-m1-libretro-{name}-{version()}.zip' for name in names}
          assert {p.name for p in root.iterdir()} == expected
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          for archive in sorted(root.glob('*.zip')):
              extracted = pathlib.Path('release/check') / archive.stem
              with zipfile.ZipFile(archive) as z:
                  z.extractall(extracted)
              check(extracted, version())
              assert (extracted / 'SOURCE_COMMIT.txt').read_text().strip() == commit
          (root / 'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in sorted(root.glob('*.zip'))))
          PY
      - name: Create or update GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/packages/* --clobber
          else
            gh release create "$RELEASE_TAG" release/packages/* \
              --verify-tag --prerelease \
              --title "TGPulse-Next Libretro ${RELEASE_TAG#v} — Model 1 Preview" \
              --notes-file "docs/releases/${RELEASE_TAG#v}.md"
          fi
