    - left_y
    observed_endpoints:
      left_min: '00'
      right_max: FF
      up_max: '00'
      down_min: FF
    backup_offsets:
    - '0x3c'
    - '0x38'
    - '0x40'
    - '0x44'
    sample: validation/nvram-campaigns/2026-10-04/netmerc/calibration/sample/saved.srm
