schema_version: 1
game:
  set: netmerc
  parent: netmerc
verification:
  status: all_catalogued_values_saved_and_reloaded_direct_abi
  date: '2026-10-04'
  method: direct_libretro_abi
  note: All four discrete operator cycles (20 values) have screenshots, isolated native-exit
    samples, backup RAM byte mappings and fresh-instance readback. Full-range controller
    endpoints are saved and reloaded. No networking setting is present in the observed
    operator pages. Real frontend/gameplay acceptance is separate.
  menu_evidence: docs/LIBRETRO_U3_NETMERC_CAMPAIGN.md
nvram_layout:
  storage: backup_ram
  size: 65536
  integrity:
    status: native_firmware_readback_verified
