schema_version: 1
game: {set: vr, parent: vr}
verification:
  status: partial
  date: "2026-10-01"
  method: direct_libretro_abi_test_menu_and_saved_srm
  note: All 10 Game System cycles and 63 values have documentary screenshots, isolated saved samples, native EEPROM CRC checks and fresh-instance menu reloads. LINK ID LIVE also triggers a communication cancellation sequence on a normal boot without a peer, so it needs separate product review. Real frontend behavior remains pending.
  menu_evidence: docs/MODEL1_DIAGNOSTIC_SETTINGS_CATALOG.md
nvram_layout:
  storage: io_eeprom
  size: 128
  integrity: {status: verified_for_game_system_samples, algorithm: CRC-16/CCITT, polynomial: 0x1021, initial_value: 0, stored_offsets: [0x08, 0x09], stored_byte_order: big_endian, covered_offsets: [0x0a, 0x7f], covered_byte_order: high_byte_first_in_each_little_endian_word}
controls:
  hold_test: L3
  next_item: B
  change_mode: A
  alternate_change_mode: Y
  enter_or_exit: X
menus:
  game_system:
    entry: Test menu, select GAME SYSTEM, enter with green View 4
    initial_selected_item: EXIT
    position_convention: Selectable red-button presses from EXIT; CHUTE display rows are skipped.
    options:
      - {key: start_credit, label: START CREDIT, position: 1, native_default: 1CREDIT START, observed_values: [1CREDIT START, 5CREDITS START, 4CREDITS START, 3CREDITS START, 2CREDITS START], values_status: cycle_closed, sample_status: all_values_saved_and_reloaded_direct_abi, nvram: {eeprom_offset: 0x14, values: [1, 5, 4, 3, 2]}}
      - key: coin_setting
        label: COIN SETTING
        position: 2
        native_default: 1
        observed_values: [1, 27, 26, 25, 24, 23, 22, 21, 20, 19, 18, 17, 16, 15, 14, 13, 12, 11, 10, 9, 8, 7, 6, 5, 4, 3, 2]
        values_status: cycle_closed
        sample_status: all_values_saved_and_reloaded_direct_abi
        nvram:
          eeprom_offsets: [0x10, 0x11, 0x12, 0x13, 0x15]
          values:
            - [1, 0, 1, 1, 0]
            - [1, 26, 1, 1, 1]
            - [1, 25, 5, 1, 5]
            - [1, 24, 1, 1, 5]
            - [2, 23, 5, 1, 5]
            - [2, 22, 1, 1, 5]
            - [3, 21, 5, 1, 5]
            - [5, 20, 1, 1, 0]
            - [1, 19, 4, 1, 4]
            - [1, 18, 1, 1, 4]
            - [4, 17, 1, 1, 0]
            - [3, 16, 1, 1, 0]
            - [1, 15, 2, 1, 2]
            - [1, 14, 1, 1, 2]
            - [2, 13, 4, 1, 0]
            - [2, 12, 2, 1, 0]
            - [2, 11, 1, 1, 0]
            - [1, 10, 6, 6, 0]
            - [1, 9, 5, 5, 0]
            - [1, 8, 4, 4, 0]
            - [1, 7, 3, 3, 0]
            - [1, 6, 5, 2, 0]
            - [1, 5, 2, 2, 0]
            - [1, 4, 5, 1, 0]
            - [1, 3, 4, 1, 0]
            - [1, 2, 3, 1, 0]
            - [1, 1, 2, 1, 0]
      - {key: car_color, label: CAR COLOR, position: 3, native_default: RED, observed_values: [RED, ORANGE, SKYBLUE, PINK, BLACK, GREEN, YELLOW, BLUE], values_status: cycle_closed, sample_status: all_values_saved_and_reloaded_direct_abi, nvram: {eeprom_offset: 0x23, values: [0, 7, 6, 5, 4, 3, 2, 1]}}
      - {key: course_select, label: COURSE SELECT, position: 4, native_default: MAJORITY VOTE, observed_values: [MAJORITY VOTE, EXPERT, MIDDLE, BEGINNER], values_status: cycle_closed, sample_status: all_values_saved_and_reloaded_direct_abi, nvram: {eeprom_offset: 0x20, values: [0, 3, 2, 1]}}
      - {key: link_id, label: LINK ID, position: 5, native_default: NO LINK, observed_values: [NO LINK, LIVE, SLAVE, MASTER], values_status: cycle_closed, sample_status: all_values_saved_and_reloaded_direct_abi, nvram: {eeprom_offset: 0x0d, values: [0, 3, 2, 1]}, operational_note: LIVE reaches a communication cancellation screen on normal boot without a linked peer; field-specific Test reload confirms the stored value but linked gameplay is unverified.}
      - {key: race_mode, label: RACE MODE, position: 6, native_default: NORMAL, observed_values: [NORMAL, GRANDPRIX], values_status: cycle_closed, sample_status: all_values_saved_and_reloaded_direct_abi, nvram: {eeprom_offset: 0x22, values: [0, 1]}}
      - {key: country, label: COUNTRY, position: 7, native_default: EXPORT, observed_values: [EXPORT, U.S, JAPAN], values_status: cycle_closed, sample_status: all_values_saved_and_reloaded_direct_abi, nvram: {eeprom_offset: 0x1a, values: [2, 1, 0]}}
      - key: monitor
        label: MONITOR
        position: 8
        native_default: "16:9 WIDE"
        observed_values: ["16:9 WIDE", "4:3 NORMAL"]
        values_status: cycle_closed
        nvram: {eeprom_offset: 0x0a, values: [1, 0]}
        sample_status: all_values_saved_and_reloaded_direct_abi
        selected_for_core: true
      - {key: cabinet, label: CABINET, position: 9, native_default: STANDARD, observed_values: [STANDARD, SPECIAL, 2P LINK, UPRIGHT], values_status: cycle_closed, sample_status: all_values_saved_and_reloaded_direct_abi, nvram: {eeprom_offset: 0x1b, values: [1, 0, 3, 2]}}
      - {key: difficulty, label: DIFFICULTY, position: 10, native_default: NORMAL, observed_values: [NORMAL, EASY, HARDEST, HARD], values_status: cycle_closed, sample_status: all_values_saved_and_reloaded_direct_abi, nvram: {eeprom_offset: 0x21, values: [1, 0, 3, 2]}}
    display_only:
      - {label: CHUTE1, observed_value: 1COIN 1CREDIT}
      - {label: CHUTE2, observed_value: 1COIN 1CREDIT}
    exit_position: 11
    save_confirmation: YES (SAVED)

