schema_version: 1
game: {set: vformula, parent: vr}
verification:
  status: partial
  date: "2026-10-01"
  method: direct_libretro_abi_test_menu_screenshots
  note: All nine Game System cycles and 59 values were acquired from this clone, saved, checked against its own screenshots and native EEPROM CRC, and redisplayed after fresh direct ABI imports. Its field encodings match shared VR fields but its complete baseline image differs; parent templates are not interchangeable. Real frontend behavior remains pending.
  menu_evidence: docs/MODEL1_DIAGNOSTIC_SETTINGS_CATALOG.md
nvram_layout:
  storage: io_eeprom
  size: 128
  integrity: {status: verified_for_game_system_samples, algorithm: CRC-16/CCITT, polynomial: 0x1021, initial_value: 0, stored_offsets: [0x08, 0x09], stored_byte_order: big_endian, covered_offsets: [0x0a, 0x7f], covered_byte_order: high_byte_first_in_each_little_endian_word}
controls: {enter_test: L3, next_item: B, change_value: A, enter_or_exit: X}
menus:
  game_system:
    entry: Enter Test after attract, select GAME SYSTEM, press green View 4
    initial_selected_item: EXIT
    options:
      - {key: start_credit, label: START CREDIT, position: 1, native_default: 1CREDIT START, observed_values: [1CREDIT START, 5CREDITS START, 4CREDITS START, 3CREDITS START, 2CREDITS START], values_status: cycle_closed, sample_status: all_values_saved_and_reloaded_direct_abi, nvram: {eeprom_offset: 0x14, values: [1, 5, 4, 3, 2]}}
      - key: coin_setting
        label: COIN SETTING
        position: 2
        native_default: 1
        observed_values: [1, 27, 26, 25, 24, 23, 22, 21, 20, 19, 18, 17, 16, 15, 14, 13, 12, 11, 10, 9, 8, 7, 6, 5, 4, 3, 2]
        values_status: cycle_closed
        sample_status: all_values_saved_and_reloaded_direct_abi
        dependent_display: CHUTE1 and CHUTE2 ratios including FREEPLAY
        nvram:
          eeprom_offsets: [0x10, 0x11, 0x12, 0x13, 0x15]
          values:
            - [1, 0, 1, 1, 0]
            - [1, 26, 1, 1, 1]
            - [1, 25, 5, 1, 5]
            - [1, 24, 1, 1, 5]
            - [2, 23, 5, 1, 5]
            - [2, 22, 1, 1, 5]
            - [3, 21, 5, 1, 5]
            - [5, 20, 1, 1, 0]
            - [1, 19, 4, 1, 4]
            - [1, 18, 1, 1, 4]
            - [4, 17, 1, 1, 0]
            - [3, 16, 1, 1, 0]
            - [1, 15, 2, 1, 2]
            - [1, 14, 1, 1, 2]
            - [2, 13, 4, 1, 0]
            - [2, 12, 2, 1, 0]
            - [2, 11, 1, 1, 0]
            - [1, 10, 6, 6, 0]
            - [1, 9, 5, 5, 0]
            - [1, 8, 4, 4, 0]
            - [1, 7, 3, 3, 0]
            - [1, 6, 5, 2, 0]
            - [1, 5, 2, 2, 0]
            - [1, 4, 5, 1, 0]
            - [1, 3, 4, 1, 0]
            - [1, 2, 3, 1, 0]
            - [1, 1, 2, 1, 0]
      - {key: car_number, label: CAR NUMBER, position: 3, native_default: NO.1 (RED), observed_values: [NO.1 (RED), NO.8 (ORANGE), NO.7 (SKYBLUE), NO.6 (PINK), NO.5 (BLACK), NO.4 (GREEN), NO.3 (YELLOW), NO.2 (BLUE)], values_status: cycle_closed, sample_status: all_values_saved_and_reloaded_direct_abi, nvram: {eeprom_offset: 0x23, values: [0, 7, 6, 5, 4, 3, 2, 1]}}
      - {key: course_select, label: COURSE SELECT, position: 4, native_default: MAJORITY VOTE, observed_values: [MAJORITY VOTE, EXPERT, MIDDLE, BEGINNER], values_status: cycle_closed, sample_status: all_values_saved_and_reloaded_direct_abi, nvram: {eeprom_offset: 0x20, values: [0, 3, 2, 1]}}
      - {key: link_id, label: LINK ID, position: 5, native_default: NO LINK, observed_values: [NO LINK, LIVE, SLAVE, MASTER], values_status: cycle_closed, sample_status: all_values_saved_and_reloaded_direct_abi, nvram: {eeprom_offset: 0x0d, values: [0, 3, 2, 1]}, operational_note: Linked-cabinet gameplay and behavior without a peer remain unverified.}
      - {key: race_mode, label: RACE MODE, position: 6, native_default: NORMAL, observed_values: [NORMAL, GRANDPRIX], values_status: cycle_closed, sample_status: all_values_saved_and_reloaded_direct_abi, nvram: {eeprom_offset: 0x22, values: [0, 1]}}
      - {key: country, label: COUNTRY, position: 7, native_default: JAPAN, observed_values: [JAPAN, EXPORT, U.S], values_status: cycle_closed, sample_status: all_values_saved_and_reloaded_direct_abi, nvram: {eeprom_offset: 0x1a, values: [0, 2, 1]}}
      - {key: advertise_sound, label: ADVERTISE SOUND, position: 8, native_default: "ON", observed_values: ["ON", "OFF"], values_status: cycle_closed, sample_status: all_values_saved_and_reloaded_direct_abi, nvram: {eeprom_offset: 0x0a, values: [0, 1]}}
      - {key: difficulty, label: DIFFICULTY, position: 9, native_default: NORMAL, observed_values: [NORMAL, EASY, HARDEST, HARD], values_status: cycle_closed, sample_status: all_values_saved_and_reloaded_direct_abi, nvram: {eeprom_offset: 0x21, values: [1, 0, 3, 2]}}
    display_only:
      - {label: CHUTE1, observed_value: 1COIN 1CREDIT}
      - {label: CHUTE2, observed_value: 1COIN 1CREDIT}
    exit_position: 10

