[package]
name = "tgpulse-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sega Model 1 and Model 2 hardware emulation, independent of any front end."

[lib]
name = "tgpulse_core"
path = "src/lib.rs"

[features]
# Preserve the complete upstream machine library for the standalone frontend.
default = ["model1", "model2"]
model1 = ["dep:v60"]
model2 = ["dep:i960", "dep:mb86235", "dep:sharc"]

[dependencies]
i960 = { workspace = true, optional = true }
v60 = { workspace = true, optional = true }
mb86233 = { workspace = true }
mb86235 = { workspace = true, optional = true }
sharc = { workspace = true, optional = true }

bincode = { workspace = true }
bytemuck = { workspace = true }
log = { workspace = true }
m68000 = { workspace = true }
serde = { workspace = true }
serde-big-array = { workspace = true }
sha1 = "0.10"
zip = { workspace = true }
z80 = { path = "../z80" }
